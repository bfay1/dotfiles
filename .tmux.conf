# --- General Settings ---
# TERM *inside* panes. tmux-256color (present in both the system and brew
# ncurses terminfo DBs) advertises italics + 256 colors, which screen-256color
# does not.
set -g default-terminal "tmux-256color"

# Truecolor passthrough, declared per OUTER terminal. Deliberately NOT a "*:RGB"
# wildcard and NOT xterm-256color: Terminal.app reports xterm-256color and has
# no truecolor, so claiming RGB there would make tmux emit sequences it cannot
# render. These four are unambiguous; add iTerm2 only if you also stop using
# Terminal.app, since the two share a TERM.
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",wezterm:RGB"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -g history-limit 10000                # Increase scrollback buffer
set -g mouse on                           # Enable mouse support (clicking, resizing)
set -w -g mode-keys vi                    # Use Vim keys in copy mode
set -g base-index 1                       # Start window numbering at 1
set -g pane-base-index 1                  # Start pane numbering at 1
set -g renumber-windows on                # Re-number windows when one is closed

# --- Keybindings ---

# Prefix
set -g prefix C-b
bind C-b send-prefix

# Easy config reload
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Better Split Commands (using | and -)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style Pane Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Seamless pane navigation with vim-tmux-navigator: Ctrl-hjkl moves between
# tmux panes, or forwards to nvim's own splits when the active pane is nvim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Fast Pane Resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Visual Styling (gruvbox dark palette) ---
# Mirrors the "Gruvbox Dark" Terminal.app profile and nvim's gruvbox.nvim.
# bg0 #282828  bg1 #3c3836  bg2 #504945  gray #928374  fg4 #a89984  fg #ebdbb2
# blue #83a598  yellow #fabd2f  orange #fe8019

set -g status-style "bg=#282828,fg=#ebdbb2"

set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#83a598"

# The status line uses Nerd Font glyphs: powerline separators U+E0B0/U+E0B2 and
# the icons below. tmux has NO font setting - the OUTER terminal supplies the
# font, so these render as tofu unless that terminal is set to a Nerd Font.
set -g status-left "#[bg=#83a598,fg=#282828,bold]  #S #[bg=#282828,fg=#83a598,nobold]"
set -g status-left-length 30

# Claude status per pane, set by ~/.claude/hooks/tmux_status.sh:
#   @claude_state  working (blue ●) | waiting for you (yellow ●)
#   @claude_goal   active (white ◎) | met (green ✓) | failed (red ✗)
# #{P:} draws one set of glyphs per Claude pane in the window. A pane draws
# nothing unless it runs Claude now (a version-named process), so a crashed
# session leaves no stale glyph. The active window has a light background,
# so it gets the dark gruvbox variant of each color.
set -g @claude_fg '#{?window_active,#282828,#928374}'
set -g @claude_working '#[fg=#{?window_active,#0033cc,#4d7cff}]●'
set -g @claude_waiting '#[fg=#{?window_active,#b57614,#fabd2f}]●'
set -g @claude_goal_active '#[fg=#{?window_active,#3c3836,#ebdbb2}]◎'
set -g @claude_goal_met '#[fg=#{?window_active,#79740e,#b8bb26}]✓'
set -g @claude_goal_failed '#[fg=#{?window_active,#9d0006,#fb4934}]✗'
set -g @claude_pane '#{?#{&&:#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{@claude_state}}, #{?#{==:#{@claude_state},working},#{E:@claude_working},#{E:@claude_waiting}}#{?#{==:#{@claude_goal},active},#{E:@claude_goal_active},}#{?#{==:#{@claude_goal},met},#{E:@claude_goal_met},}#{?#{==:#{@claude_goal},failed},#{E:@claude_goal_failed},}#[fg=#{E:@claude_fg}],}'

set -g window-status-separator ""
set -g window-status-style "fg=#928374,bg=#282828"
set -g window-status-format "  #I  #W#{P:#{E:@claude_pane}} "
set -g window-status-current-style "fg=#282828,bg=#a89984,bold"
set -g window-status-current-format "#[fg=#a89984,bg=#282828]#[fg=#282828,bg=#a89984,bold] #I  #W#{P:#{E:@claude_pane}} #[fg=#a89984,bg=#282828]"

set -g status-right "#[fg=#504945,bg=#282828]#[fg=#a89984,bg=#504945]  %Y-%m-%d  #[fg=#fabd2f]  %H:%M "
set -g status-right-length 40

set -g message-style "bg=#fabd2f,fg=#282828"
set -g message-command-style "bg=#fabd2f,fg=#282828"

# Copy-mode selection, matched to the Terminal.app profile's SelectionColor
set -g mode-style "bg=#504945,fg=#ebdbb2"

# Window names. Claude Code runs as a binary named after its version
# (~/.local/share/claude/versions/2.1.289), so the default rename shows
# "2.1.289". For a version-named process, use the pane title Claude sets
# instead, minus its status glyph ("✳ ", or a spinner while working).
# Fall back to "claude" when the title is unset or the unnamed "Claude Code".
# Everything else keeps tmux's default format.
set -g automatic-rename-format '#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{?#{||:#{==:#{s/^[^A-Za-z0-9]+ //:pane_title},},#{||:#{==:#{s/^[^A-Za-z0-9]+ //:pane_title},Claude Code},#{==:#{pane_title},#{host}}}},claude,#{s/^[^A-Za-z0-9]+ //:pane_title}},#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}}'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
