# --- General Settings ---
set -g default-terminal "screen-256color" # Proper colors
set -g history-limit 10000                # Increase scrollback buffer
set -g mouse on                           # Enable mouse support (clicking, resizing)
set -w -g mode-keys vi                    # Use Vim keys in copy mode
set -g base-index 1                       # Start window numbering at 1
set -g pane-base-index 1                  # Start pane numbering at 1
set -g renumber-windows on                # Re-number windows when one is closed

# Claude Code runs as a versioned binary (pane command looks like "2.1.289").
# It sets the pane title to "<status glyph> <session name>" (✳ when idle, a
# spinner while working), so name those windows after the session by stripping
# the leading glyph. Renaming the session updates the title, and with it the window.
set -g automatic-rename on
set -g automatic-rename-format "#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},#{s/^[^ ]+ //:pane_title},#{pane_current_command}}"

# --- Keybindings ---

# Prefix
set -g prefix C-b
bind C-b send-prefix

# Easy config reload
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Better Split Commands (using | and -)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style Pane Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Seamless pane navigation with vim-tmux-navigator: Ctrl-hjkl moves between
# tmux panes, or forwards to nvim's own splits when the active pane is nvim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Fast Pane Resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Visual Styling (gruvbox palette) ---

set -g status-style "bg=#282828,fg=#ebdbb2"

set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#83a598"

set -g status-left "#[bg=#83a598,fg=#282828,bold] #S #[bg=#282828,fg=#83a598,nobold]"
set -g status-left-length 20

set -g window-status-style "fg=#928374,bg=#282828"
set -g window-status-format " #I:#W "
set -g window-status-current-style "fg=#282828,bg=#a89984,bold"
set -g window-status-current-format " #I:#W "

set -g status-right "#[fg=#928374]%Y-%m-%d #[fg=#fabd2f]%H:%M "

set -g message-style "bg=#fabd2f,fg=#282828"
set -g message-command-style "bg=#fabd2f,fg=#282828"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic restore on tmux start
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
